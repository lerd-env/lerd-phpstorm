pluginGroup = sh.lerd.ide
pluginName = Lerd
pluginVersion = 0.1.0

# PhpStorm 2025.2 is the oldest build the plugin supports, and the one it
# compiles against, so an API added later cannot slip in unnoticed.
platformType = PS
platformVersion = 2025.2
pluginSinceBuild = 252

kotlin.stdlib.default.dependency = false
# Off on purpose: adding a field to a data class changes its synthetic
# constructor, and the incremental compiler kept leaving tests compiled against
# the old one, failing with NoSuchMethodError. A clean build takes 3 seconds.
kotlin.incremental = false

# Off on purpose: the cache handed back test classes compiled against an older
# model and turned a passing suite red for no reason. The project builds in
# seconds without it.
org.gradle.caching = false
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx2g
